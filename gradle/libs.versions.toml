#
# HugMun dependency catalogue.
#
# Policy:
#   * Stable releases only. No alpha, beta or rc in the main source set.
#   * Versions here were verified against dl.google.com and repo1.maven.org
#     on 2026-09-21 rather than copied from a template.
#   * Anything on the measurement path (psychophysics, DSP, scheduling) has
#     no third-party runtime dependency at all — see docs/adr/.
#

[versions]
# --- Build tooling -----------------------------------------------------------
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
androidCompileSdk = "37"
androidTargetSdk = "36"
androidMinSdk = "26"
# Macrobenchmark requires API 28+ for the profiling hooks it relies on.
androidBenchmarkMinSdk = "28"
jvmToolchain = "21"

# --- AndroidX ----------------------------------------------------------------
androidxActivity = "1.13.0"
androidxCamera = "1.6.2"
androidxComposeBom = "2026.09.00"
androidxCore = "1.19.0"
androidxCoreSplashscreen = "1.0.1"
androidxDatastore = "1.2.1"
androidxGraphicsShapes = "1.1.0"
androidxLifecycle = "2.11.0"
androidxNavigation3 = "1.1.7"
androidxProfileinstaller = "1.4.1"
androidxRoom3 = "3.0.3"
androidxSecurityCrypto = "1.1.0"
androidxSqlite = "2.7.1"
androidxWork = "2.11.2"

# --- Kotlin ecosystem --------------------------------------------------------
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.11.0"

# --- Quality -----------------------------------------------------------------
detekt = "1.23.8"
spotless = "7.0.2"
ktlint = "1.5.0"

# --- Test --------------------------------------------------------------------
androidxBenchmark = "1.5.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxUiAutomator = "2.4.0"
junit4 = "4.13.2"
robolectric = "4.15.1"
turbine = "1.2.1"

[libraries]
# --- Compose (versions come from the BOM) ------------------------------------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-text-google-fonts = { group = "androidx.compose.ui", name = "ui-text-google-fonts" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# --- AndroidX core -----------------------------------------------------------
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "androidxGraphicsShapes" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "androidxProfileinstaller" }

# --- Lifecycle ---------------------------------------------------------------
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "androidxLifecycle" }

# --- Navigation 3 ------------------------------------------------------------
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "androidxNavigation3" }

# --- Persistence -------------------------------------------------------------
androidx-room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "androidxRoom3" }
androidx-room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "androidxRoom3" }
androidx-room3-testing = { group = "androidx.room3", name = "room3-testing", version.ref = "androidxRoom3" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "androidxSqlite" }
