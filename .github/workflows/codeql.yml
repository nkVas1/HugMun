name: CodeQL

# Scope note, so the gap is visible rather than quietly absent.
#
# This scans the GitHub Actions workflows, not the application source. CodeQL's
# Java/Kotlin extractor refuses Kotlin 2.4.20 — "Kotlin version 2.4.20 is too recent,
# CodeQL currently supports versions below 2.4.20" — and that version is not a choice
# here: it is the compiler built into AGP 9.4.1. Pinning Kotlin down to satisfy the
# scanner would mean pinning the whole toolchain down with it.
#
# The workflow analysis is not a consolation prize. Workflows run with repository
# credentials and pull third-party actions, which is the one place in a no-network,
# local-only Android app where a supply-chain problem could actually reach something.
#
# To restore source analysis once the extractor catches up: add `java-kotlin` back to
# the matrix below, restore the JDK setup and `./gradlew :app:assembleDebug --no-daemon`
# as a manual build-mode step, and delete this note.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1'

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [actions]

    steps:
      - uses: actions/checkout@v5

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
