version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      androidx-compose:
        patterns: ['androidx.compose*']
      androidx-other:
        patterns: ['androidx.*']
        exclude-patterns: ['androidx.compose*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'org.jetbrains.kotlinx*']

  - package-ecosystem: gradle
    directory: /build-logic
    schedule:
      interval: weekly
    labels: [dependencies, build]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
