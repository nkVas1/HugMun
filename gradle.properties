# --- JVM / daemon -----------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# --- Kotlin -----------------------------------------------------------------
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# --- Android ----------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
# AGP 9 already defaults buildConfig, resValues and shaders to off; the explicit
# properties were removed in 9.0. Modules that need BuildConfig opt in individually.
