# Classes the Compose compiler should treat as stable.
#
# Everything listed here is genuinely immutable by construction; nothing is silenced
# here to hide a recomposition problem. If a type needs to be added, it needs a reason
# in the commit message.

# Kotlin stdlib collections are only used as immutable snapshots in UI state.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set

# kotlinx-datetime value types.
kotlinx.datetime.Instant
kotlinx.datetime.LocalDate
kotlinx.datetime.LocalDateTime
kotlinx.datetime.LocalTime

# Kotlin duration is a value class over a Long.
kotlin.time.Duration
